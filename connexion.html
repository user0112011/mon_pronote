
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | MyPronote</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-box">

        <h1>My<span>Pronote</span></h1>
        <p class="login-subtitle">Ton espace scolaire personnel</p>

        <h2>Bienvenue ! 👋</h2>
        <p>Connecte-toi à ton compte.</p>

        <form id="login-form">

            <label>Je suis :</label>

            <select id="role">
                <option value="eleve">Élève</option>
                <option value="professeur">Professeur</option>
            </select>

            <label>Identifiant</label>
            <input type="text" id="username"
                placeholder="Ton identifiant" required>

            <label>Mot de passe</label>
            <input type="password" id="password"
                placeholder="Ton mot de passe" required>

            <button type="submit">Se connecter</button>

            <p id="login-message"></p>

        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
